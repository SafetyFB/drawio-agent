<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>drawio-agent render</title>
  <style>
    html, body { margin: 0; padding: 0; background: #ffffff; }
    #host { display: inline-block; }
  </style>
  <script src="./viewer-static.min.js"></script>
</head>
<body>
  <div id="host"></div>
  <script>
    // Single entry point called from Rust: render XML -> PNG data URL.
    // Uses mxGraph (bundled inside viewer-static.min.js).
    window.__renderXml = function (xmlString, scale, bg, border) {
      return new Promise(function (resolve, reject) {
        try {
          var host = document.getElementById('host');
          host.innerHTML = '';

          // Parse the XML.
          var xmlDoc = mxUtils.parseXml(xmlString);
          if (!xmlDoc) {
            reject('parseXml returned null');
            return;
          }

          // Build a fresh model + graph (no shared state between calls).
          var model = new mxGraphModel();
          var codec = new mxCodec(xmlDoc);
          codec.decode(xmlDoc.documentElement, model);

          var graph = new mxGraph(host, model);
          graph.setEnabled(false);
          graph.setPanning(false);

          // After layout/render, export to PNG.
          graph.addListener('postrender', function () {
            try {
              var bounds = graph.getGraphBounds();
              var w = Math.ceil((bounds.width || 1) + 2 * border);
              var h = Math.ceil((bounds.height || 1) + 2 * border);
              var xmlCanvas = new mxXmlCanvas2D(w * scale, h * scale);
              xmlCanvas.scale = scale;
              xmlCanvas.translate(-bounds.x + border, -bounds.y + border);
              if (bg) {
                xmlCanvas.setBackground = bg;
              }
              var exp = new mxImageExport();
              exp.drawState(graph.view.state, xmlCanvas);
              var dataUrl = xmlCanvas.close();
              resolve(dataUrl);
            } catch (e) {
              reject(String(e));
            }
          });

          graph.refresh();
        } catch (e) {
          reject(String(e));
        }
      });
    };
  </script>
</body>
</html>
