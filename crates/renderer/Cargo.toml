[package]
name = "drawio-agent-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Draw.io diagram renderer: RenderDriver trait + MockDriver (headless Chromium impl deferred)"

[dependencies]
async-trait = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "net"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
url = "2"
base64 = "0.22"
uuid = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
