<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draw.io Agent</title>
  <link rel="stylesheet" href="app.css">
  <script src="./vendor/viewer-static.min.js" onload="window.drawioEmbedLoaded = true"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <h1>Draw.io Agent</h1>
    </div>
    <div class="session-bar">
      <label for="session-select" class="sr-only">Session</label>
      <select id="session-select">
        <option value="">— select a session —</option>
      </select>
      <button id="new-session-btn" type="button">+ new</button>
      <div id="status" class="status disconnected" role="status" aria-label="Disconnected">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-text">disconnected</span>
      </div>
    </div>
  </header>

  <main class="workspace">
    <section class="canvas-region" aria-label="Diagram canvas">
      <div class="canvas-toolbar" role="toolbar" aria-label="Canvas tools">
        <button type="button" id="canvas-tool-pan" class="canvas-tool active" title="Pan mode (drag to move the canvas)" aria-pressed="true">✋</button>
        <button type="button" id="canvas-tool-select" class="canvas-tool active" title="Select mode (click cells to select)" aria-pressed="true">⊕</button>
      </div>
      <div id="drawio-container" class="drawio-container"></div>
      <div id="canvas-placeholder" class="canvas-placeholder" style="display:none">
        <p>No diagram yet.</p>
        <p class="sub">Describe what you want in the AI panel and hit Send.</p>
      </div>
      <div id="canvas-overlay" class="canvas-overlay" style="display:none">
        <span class="spinner" aria-hidden="true"></span>
        <span id="canvas-overlay-text">working…</span>
      </div>
    </section>

    <aside class="ai-panel" aria-label="AI assistant">
      <div id="selection-patch" class="selection-patch" hidden>
        <div class="selection-header">
          <span class="selection-chip" id="selection-chip">0 selected</span>
          <button type="button" class="link-btn" id="selection-clear">clear</button>
        </div>
        <textarea id="selection-instruction" rows="2" placeholder="e.g. 把这两个 box 之间的距离拉远"></textarea>
        <div class="selection-actions">
          <button type="button" id="selection-modify-btn" class="primary-btn" disabled>Modify selected</button>
        </div>
      </div>

      <label for="prompt" class="panel-label">AI 助手</label>
      <textarea id="prompt" rows="6" placeholder="Describe the diagram you want…"></textarea>
      <div id="refine-hint" class="refine-hint" hidden aria-live="polite">
        <span class="refine-hint-icon" aria-hidden="true">💡</span>
        <span class="refine-hint-text">Refine needs a starting diagram. Switch to Fast to generate one, then come back to Refine.</span>
        <button type="button" id="refine-hint-cta" class="refine-hint-cta">Run as Fast</button>
      </div>
      <div class="send-row">
        <div class="thinking-toggle" role="radiogroup" aria-label="Thinking depth">
          <button type="button" class="thinking-option" data-depth="fast" role="radio" aria-checked="true">
            <span class="thinking-icon" aria-hidden="true">⚡</span> Fast
          </button>
          <button type="button" class="thinking-option" data-depth="refine" role="radio" aria-checked="false">
            <span class="thinking-icon" aria-hidden="true">🔄</span> Refine
          </button>
        </div>
        <button type="button" id="send-btn" class="primary-btn send-btn" disabled>
          <span>Send</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div id="run-status" class="run-status" style="display:none">
        <span class="spinner" aria-hidden="true"></span>
        <span id="run-status-text">running…</span>
      </div>
      <div id="error-box" class="error-box" role="alert" style="display:none"></div>

      <div class="activity-region">
        <h2 class="panel-label">Activity</h2>
        <ul id="activity-log" class="activity-log" aria-live="polite" aria-atomic="false"></ul>
      </div>
    </aside>
  </main>

  <footer class="action-bar" aria-label="Export actions">
    <span class="action-bar__title">Export</span>
    <div class="action-bar__actions">
      <button id="export-png-btn" type="button" class="primary" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export PNG
      </button>
      <button id="download-svg-btn" type="button" class="secondary" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        Download SVG
      </button>
      <button id="copy-xml-url-btn" type="button" class="secondary" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy XML URL
      </button>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
