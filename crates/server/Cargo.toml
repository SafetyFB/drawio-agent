[package]
name = "drawio-agent-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP + WebSocket server for the Draw.io Agent"

[dependencies]
async-trait = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { version = "0.5", features = ["fs"] }
url = "2"
uuid = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls"] }
drawio-agent-xml-core = { path = "../xml-core" }
drawio-agent-llm-client = { path = "../llm-client" }
drawio-agent-renderer = { path = "../renderer" }
drawio-agent-trajectory = { path = "../trajectory" }

[[bin]]
name = "drawio-agent-server"
path = "src/bin/server.rs"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
