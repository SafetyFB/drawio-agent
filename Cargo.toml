[workspace]
resolver = "2"
members = [
    "crates/xml-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["Draw.io Agent Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.36", features = ["serialize"] }
flate2 = "1"
base64 = "0.22"
thiserror = "1"
anyhow = "1"

[profile.dev]
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
