[workspace]
resolver = "2"
members = [
    "crates/renderer",
    "crates/harness",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["Draw.io Agent Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
flate2 = "1"
base64 = "0.22"
thiserror = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "fs"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
axum = "0.7"
tokio-stream = "0.1"
